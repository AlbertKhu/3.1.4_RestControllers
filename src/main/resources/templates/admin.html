<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Admin panel</title>
</head>
<body class="bg-light">
<header class="header navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-1">
    <div class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6">
        <span id="currentUsername" class="h5 fw-bold">Loading...</span>
        <span class="h5 fw-light"> with roles: </span>
        <span id="currentUserRoles" class="h5 fw-light">Loading...</span>
    </div>
    <div class="navbar-nav">
        <div class="nav-item text-nowrap">
            <form id="logoutForm" action="/logout" method="post">
                <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-link nav-link px-3">Logout</button>
            </form>
        </div>
    </div>
</header>

<div class="container-fluid">
    <div class="row">
        <nav class="d-grid nav nav-pills flex-column col-md-3 col-xl-2 d-md-block px-0 pt-2 bg-white">
            <div class="position-sticky" style="height: calc(100vh - 48px); overflow-x: hidden;">
                <a class="nav-link active" href="/admin" id="adminLink">Admin</a>
                <a class="nav-link" href="/user" id="userLink">User</a>
            </div>
        </nav>

        <main class="col-md-9 col-xl-10 ms-sm-auto bg-light px-md-4 pt-2">
            <div class="row row-cols-1">
                <div class="col">
                    <h1>Admin panel</h1>
                    <nav>
                        <div class="nav nav-tabs" id="nav-tab" role="tablist">
                            <button class="nav-link active" id="user-table-tab" data-bs-toggle="tab"
                                    data-bs-target="#nav-user-table" type="button">User table</button>
                            <button class="nav-link" id="new-user-tab" data-bs-toggle="tab"
                                    data-bs-target="#nav-new-user" type="button">New User</button>
                        </div>
                    </nav>

                    <div class="tab-content" id="nav-tabContent">
                        <!-- User Table Tab -->
                        <div class="tab-pane fade show active" id="nav-user-table" role="tabpanel">
                            <div class="col border rounded-top ps-3 py-2">
                                <h4 class="m-0">All users</h4>
                            </div>
                            <div class="col bg-white border border-top-0 rounded-bottom p-3">
                                <table class="table table-striped align-middle" id="userTable">
                                    <thead class="border-top">
                                    <tr>
                                        <th>ID</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Age</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                    </thead>
                                    <tbody id="userTableBody">
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- New User Tab -->
                        <div class="tab-pane fade" id="nav-new-user" role="tabpanel">
                            <div class="col border rounded-top ps-3 py-2">
                                <h4 class="m-0">Add new user</h4>
                            </div>
                            <div class="col bg-white border border-top-0 rounded-bottom p-3">
                                <div class="col-lg-6 col-xxl-3 mx-auto text-center">
                                    <form id="newUserForm">
                                        <input type="hidden" name="_csrf" th:value="${_csrf.token}">

                                        <label class="form-label mt-3 mb-0"><strong>First name</strong></label>
                                        <input class="form-control" id="newFirstName" name="firstName" required>

                                        <label class="form-label mt-3 mb-0"><strong>Last name</strong></label>
                                        <input class="form-control" id="newLastName" name="lastName" required>

                                        <label class="form-label mt-3 mb-0"><strong>Age</strong></label>
                                        <input class="form-control" id="newAge" name="age" type="number" required>

                                        <label class="form-label mt-3 mb-0"><strong>Email</strong></label>
                                        <input class="form-control" id="newEmail" name="email" type="email" required>

                                        <label class="form-label mt-3 mb-0"><strong>Password</strong></label>
                                        <input class="form-control" id="newPassword" name="password" type="password" required>

                                        <label class="form-label mt-3 mb-0"><strong>Role</strong></label>
                                        <select class="form-select" id="newRoles" name="roleIds" multiple required>
                                            <!-- Roles will be loaded here via JS -->
                                        </select>

                                        <button class="btn btn-success btn-lg mt-3" type="submit">Add new user</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Edit User -->
<div class="modal fade" id="userEdit" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                    <input type="hidden" id="editId" name="id">

                    <label class="form-label mt-3 mb-0"><strong>First name</strong></label>
                    <input class="form-control" id="editFirstName" name="firstName" required>

                    <label class="form-label mt-3 mb-0"><strong>Last name</strong></label>
                    <input class="form-control" id="editLastName" name="lastName" required>

                    <label class="form-label mt-3 mb-0"><strong>Age</strong></label>
                    <input class="form-control" id="editAge" name="age" type="number" required>

                    <label class="form-label mt-3 mb-0"><strong>Email</strong></label>
                    <input class="form-control" id="editEmail" name="email" type="email" required>

                    <label class="form-label mt-3 mb-0"><strong>Password</strong></label>
                    <input class="form-control" id="editPassword" name="password" type="password">

                    <label class="form-label mt-3 mb-0"><strong>Role</strong></label>
                    <select class="form-select" id="editRoles" name="roleIds" multiple required>
                    </select>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="submit" form="editForm" class="btn btn-success">Save changes</button>
            </div>
        </div>
    </div>
</div>

<!-- Delete User -->
<div class="modal fade" id="userDelete" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this user?</p>
                <div id="deleteUserInfo"></div>
                <form id="deleteForm">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                    <input type="hidden" id="deleteId" name="id">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="deleteForm" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let users = [];
    let roles = [];
    let currentUser = {};
    let csrfToken = '';

    document.addEventListener('DOMContentLoaded', async () => {
        const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
        if (token && header) {
            csrfToken = token;
            fetch = (originalFetch => {
                return function(url, options = {}) {
                    options.headers = options.headers || {};
                    options.headers[header] = token;
                    options.credentials = 'include';
                    return originalFetch(url, options);
                };
            })(fetch);
        }
        await loadCurrentUser();

        await Promise.all([loadUsers(), loadRoles()]);

        renderUserTable();
        renderRoleSelects();

        setupEventListeners();
    });

    // API Functions
    async function loadCurrentUser() {
        try {
            const response = await fetch('/api/user', {
                credentials: 'include',
                headers: {
                    'X-CSRF-TOKEN': csrfToken
                }
            });

            if (!response.ok) throw new Error('Failed to load user data');

            currentUser = await response.json();
            document.getElementById('currentUsername').textContent = currentUser.email;
            document.getElementById('currentUserRoles').textContent =
                currentUser.roles.map(r => r.name.replace('ROLE_', '')).join(', ');
        } catch (error) {
            console.error('Error loading current user:', error);
            alert('Error loading user data');
        }
    }

    async function loadUsers() {
        try {
            const response = await fetch('/api/admin', {
                credentials: 'include',
                headers: {
                    'X-CSRF-TOKEN': csrfToken
                }
            });

            if (!response.ok) throw new Error('Failed to load users');

            users = await response.json();
        } catch (error) {
            console.error('Error loading users:', error);
            alert('Error loading users');
        }
    }

    async function loadRoles() {
        try {
            const response = await fetch('/api/admin/roles', {
                credentials: 'include',
                headers: {
                    'X-CSRF-TOKEN': csrfToken
                }
            });

            if (!response.ok) throw new Error('Failed to load roles');

            roles = await response.json();
        } catch (error) {
            console.error('Error loading roles:', error);
            alert('Error loading roles');
        }
    }

    // Render Functions
    function renderUserTable() {
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';

        users.forEach(user => {
            const row = document.createElement('tr');
            row.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.firstName}</td>
                    <td>${user.lastName}</td>
                    <td>${user.age}</td>
                    <td>${user.email}</td>
                    <td>${user.roles.map(r => r.name.replace('ROLE_', '')).join(', ')}</td>
                    <td>
                        <button class="btn btn-success edit-btn"
                                data-user-id="${user.id}">
                            Edit
                        </button>
                    </td>
                    <td>
                        <button class="btn btn-danger delete-btn"
                                data-user-id="${user.id}">
                            Delete
                        </button>
                    </td>
                `;
            tbody.appendChild(row);
        });
    }

    function renderRoleSelects() {
        const selects = [
            document.getElementById('newRoles'),
            document.getElementById('editRoles')
        ];

        selects.forEach(select => {
            if (select) {
                select.innerHTML = '';
                roles.forEach(role => {
                    const option = document.createElement('option');
                    option.value = role.id;
                    option.textContent = role.name.replace('ROLE_', '');
                    select.appendChild(option);
                });
            }
        });
    }

    // Event Handlers
    function setupEventListeners() {
        // New User Form
        document.getElementById('newUserForm')?.addEventListener('submit', handleAddUser);

        // Edit User Form
        document.getElementById('editForm')?.addEventListener('submit', handleEditUser);

        // Delete Form
        document.getElementById('deleteForm')?.addEventListener('submit', handleDeleteUser);

        // Edit/Delete buttons
        document.getElementById('userTableBody')?.addEventListener('click', (e) => {
            if (e.target.classList.contains('edit-btn')) {
                prepareEditModal(e.target.dataset.userId);
                new bootstrap.Modal(document.getElementById('userEdit')).show();
            } else if (e.target.classList.contains('delete-btn')) {
                prepareDeleteModal(e.target.dataset.userId);
                new bootstrap.Modal(document.getElementById('userDelete')).show();
            }
        });
    }

    function prepareEditModal(userId) {
        const user = users.find(u => u.id == userId);
        if (!user) return;

        document.getElementById('editId').value = user.id;
        document.getElementById('editFirstName').value = user.firstName;
        document.getElementById('editLastName').value = user.lastName;
        document.getElementById('editAge').value = user.age;
        document.getElementById('editEmail').value = user.email;

        // Set selected roles
        const roleSelect = document.getElementById('editRoles');
        Array.from(roleSelect.options).forEach(option => {
            option.selected = user.roles.some(r => r.id == option.value);
        });
    }

    function prepareDeleteModal(userId) {
        const user = users.find(u => u.id == userId);
        if (!user) return;

        document.getElementById('deleteUserInfo').innerHTML = `
                <p><strong>ID:</strong> ${user.id}</p>
                <p><strong>Name:</strong> ${user.firstName} ${user.lastName}</p>
                <p><strong>Email:</strong> ${user.email}</p>
                <p><strong>Roles:</strong> ${user.roles.map(r => r.name.replace('ROLE_', '')).join(', ')}</p>
            `;

        document.getElementById('deleteId').value = user.id;
    }

    // Form Handlers
    async function handleAddUser(e) {
        e.preventDefault();

        const formData = {
            firstName: document.getElementById('newFirstName').value,
            lastName: document.getElementById('newLastName').value,
            age: document.getElementById('newAge').value,
            email: document.getElementById('newEmail').value,
            password: document.getElementById('newPassword').value,
            roleIds: Array.from(document.getElementById('newRoles').selectedOptions)
                .map(opt => opt.value)
        };

        try {
            const response = await fetch('/api/admin', {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': csrfToken
                },
                body: JSON.stringify(formData)
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || 'Failed to add user');
            }

            await loadUsers();
            renderUserTable();

            // Reset form and switch tab
            e.target.reset();
            document.getElementById('user-table-tab').click();

            alert('User added successfully!');
        } catch (error) {
            console.error('Error adding user:', error);
            alert(`Error: ${error.message}`);
        }
    }

    async function handleEditUser(e) {
        e.preventDefault();

        const userId = document.getElementById('editId').value;
        const formData = {
            firstName: document.getElementById('editFirstName').value,
            lastName: document.getElementById('editLastName').value,
            age: document.getElementById('editAge').value,
            email: document.getElementById('editEmail').value,
            password: document.getElementById('editPassword').value,
            roleIds: Array.from(document.getElementById('editRoles').selectedOptions)
                .map(opt => opt.value)
        };

        try {
            const response = await fetch(`/api/admin/${userId}`, {
                method: 'PUT',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': csrfToken
                },
                body: JSON.stringify(formData)
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || 'Failed to update user');
            }

            await loadUsers();
            renderUserTable();

            // Close modal
            bootstrap.Modal.getInstance(document.getElementById('userEdit')).hide();

            alert('User updated successfully!');
        } catch (error) {
            console.error('Error updating user:', error);
            alert(`Error: ${error.message}`);
        }
    }

    async function handleDeleteUser(e) {
        e.preventDefault();

        const userId = document.getElementById('deleteId').value;

        try {
            const response = await fetch(`/api/admin/${userId}`, {
                method: 'DELETE',
                credentials: 'include',
                headers: {
                    'X-CSRF-TOKEN': csrfToken
                }
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || 'Failed to delete user');
            }

            await loadUsers();
            renderUserTable();

            // Close modal
            bootstrap.Modal.getInstance(document.getElementById('userDelete')).hide();

            alert('User deleted successfully!');
        } catch (error) {
            console.error('Error deleting user:', error);
            alert(`Error: ${error.message}`);
        }
    }
</script>
</body>
</html>
